name: Deploy (reutilizable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      tag:
        required: true
        type: string
      read_only:
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: deploy-${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image }}
      TAG: ${{ inputs.tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: ./scripts/pipeline/setup-ssh.sh

      - name: Copiar archivos de despliegue al servidor
        run: |
          ssh deploy "mkdir -p '$DEPLOY_PATH'"
          scp -r deploy monitoring scripts "deploy:$DEPLOY_PATH/"

      - name: Iniciar sesión en GHCR desde el servidor
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | ssh deploy "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Generar el entorno
        run: ssh deploy "cd '$DEPLOY_PATH' && ENVIRONMENT='$ENVIRONMENT' bash scripts/environment/provision.sh"

      - name: Desplegar versión
        run: ssh deploy "cd '$DEPLOY_PATH' && IMAGE='$IMAGE' TAG='$TAG' bash scripts/deploy/deploy.sh"

      - name: Pruebas de humo
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          EXPECTED_VERSION: ${{ inputs.tag }}
          READ_ONLY: ${{ inputs.read_only }}
        run: bash scripts/tests/smoke-test.sh

      - name: Chequeo de niveles de servicio
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: bash scripts/tests/sla-check.sh
