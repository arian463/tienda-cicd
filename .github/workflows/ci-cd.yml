name: CI/CD Tienda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Integración continua
        run: ./scripts/pipeline/ci.sh

  build:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Calcular nombre y etiqueta de la imagen
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Iniciar sesión en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construir y publicar imagen
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: ./scripts/pipeline/build-image.sh

  staging:
    needs: build
    runs-on: [self-hosted, linux]
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      ENVIRONMENT: staging
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ needs.build.outputs.tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      BASE_URL: ${{ vars.BASE_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Copiar archivos de despliegue
        run: bash scripts/pipeline/stage-files.sh

      - name: Generar el entorno
        run: bash "$DEPLOY_PATH/scripts/environment/provision.sh"

      - name: Desplegar versión
        run: bash "$DEPLOY_PATH/scripts/deploy/deploy.sh"

      - name: Pruebas de humo
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.tag }}
        run: bash scripts/tests/smoke-test.sh

      - name: Chequeo de niveles de servicio
        run: bash scripts/tests/sla-check.sh